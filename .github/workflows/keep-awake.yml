# Free Supabase projects pause after a week with no database activity.
# This asks the database one small question every day so My Money stays awake.
name: Keep server awake

on:
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database one small question
        run: |
          URL=https://yzmhtsdyyqcefynvonds.supabase.co
          KEY=sb_publishable__JUpgTrY5Q2B32WNAYVDbA_Q-eOmPQd
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/fx_rates?select=day&limit=1" -H "apikey: $KEY")
          echo "Server answered: $code"
          test "$code" = "200"
