# Runs the automated tests every time something is pushed.
# A red ✗ next to a change on GitHub means a test failed; the report is attached to the run.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
